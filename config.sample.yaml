# ============================================================
#  EC新着・値下げ監視ツール 設定ファイル
# ============================================================
#  このファイルを「config.yaml」という名前でコピーして使います。
#  メモ帳などで開いて、「ここに～」と書かれた部分を書き換えてください。
#
#  【書き方の注意】
#   ・「#」から後ろはメモ（説明）なので、動作には関係ありません。
#   ・行の先頭の空白（字下げ）には意味があります。ずらさないでください。
#   ・空白は必ず「半角スペース」を使ってください（全角スペースは使えません）。
#   ・「:」の後ろには半角スペースを1つ入れてください。
#   ・保存するときの文字コードは「UTF-8」にしてください。
# ============================================================


# ------------------------------------------------------------
# Discord（通知先）の設定
# ------------------------------------------------------------
discord:
  # Discordで作成した「ウェブフックURL」を貼り付けてください（README の手順2）
  webhook_url: "ここにDiscordのウェブフックURL"


# ------------------------------------------------------------
# 楽天ウェブサービスの設定（README の手順1で取得したもの）
# ------------------------------------------------------------
rakuten:
  # アプリケーションID（「2fc160ec-...」のような英数字とハイフンの文字）
  application_id: "ここに楽天のアプリケーションID"
  # アクセスキー（「pk_」で始まる文字）
  access_key: "ここに楽天のアクセスキー"
  # 楽天のアプリ登録画面で「許可されたWebサイト」に入力したURL（例：https://myblog.jp）
  allowed_website: "ここに許可されたWebサイトのURL"


# ------------------------------------------------------------
# 全体の動作設定
# ------------------------------------------------------------
settings:
  # 初めてチェックしたときに見つかった商品も通知するか
  #   false … 通知しない（おすすめ。最初に大量の通知が届くのを防ぎます）
  #   true  … 通知する
  first_run_notify: false

  # 何円以上値下がりしたら通知するか（1 なら、1円でも下がれば通知）
  min_drop_yen: 1

  # 何％以上値下がりしたら通知するか（0 なら割合は気にしない）
  #   例：5 にすると、5％以上の値下げのときだけ通知
  min_drop_percent: 0

  # ログ（動作記録）の細かさ。普段は INFO のままで大丈夫です
  log_level: INFO


# ------------------------------------------------------------
# 監視条件（いくつでも登録できます）
# ------------------------------------------------------------
#  「- name:」から次の「- name:」までが1つの監視条件です。
#  増やすときは、1つ分をまるごとコピーして下に貼り付け、内容を書き換えてください。
#  ※ name（名前）は、条件ごとに別の名前にしてください。
watches:
  - name: "Switch本体"               # 監視条件の名前（通知に表示されます）
    site: rakuten                     # 対象サイト（今のバージョンは rakuten のみ）
    keyword: "Nintendo Switch 本体"   # 検索キーワード（空白で区切ると「すべて含む」検索）
    exclude_keywords:                 # 除外キーワード（商品名に含まれていたら通知しない）
      - "中古"
      - "ジャンク"
      - "ケースのみ"
    min_price: 20000                  # 価格の下限（円）。指定しないときは行ごと消す
    max_price: 40000                  # 価格の上限（円）。指定しないときは行ごと消す
    interval_minutes: 10              # 何分ごとにチェックするか（最小5分。短すぎると自動で延長）
    max_pages: 1                      # 何ページ分チェックするか（1ページ＝30件。1〜10）
    sort: newest                      # 並び順：newest（更新が新しい順）/ price_asc（安い順）/ standard（標準）
    in_stock_only: true               # 在庫ありの商品だけにするか（true / false）

  - name: "ワイヤレスイヤホン"
    site: rakuten
    keyword: "ワイヤレスイヤホン ノイズキャンセリング"
    exclude_keywords:
      - "中古"
    max_price: 15000
    interval_minutes: 15
    max_pages: 2
    sort: newest
    in_stock_only: true
